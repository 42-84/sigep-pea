# SIGEP - Referentiel
spring.application.name=sigep-referentiel
server.port=8081

# Base partagee SIGEP (H2 en dev, Oracle en prod via application-prod.properties)
# AUTO_SERVER : les trois services ouvrent le meme fichier. MODE=Oracle pour les requetes natives (ROWNUM).
spring.datasource.url=jdbc:h2:file:~/sigep-dev/sigep;AUTO_SERVER=TRUE;MODE=Oracle;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sigep
spring.datasource.password=sigep
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# data.sql : MERGE INTO pour pouvoir relancer sans vider la base.
# continue-on-error : sinon impossible de demarrer les services dans le desordre (FK). Voir INSTALL.txt.
spring.datasource.initialize=true
spring.datasource.continue-on-error=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Securite : en dev, tout le monde est back-office
sigep.securite.actif=true
sigep.securite.utilisateur-dev=U030001

# Import fournisseur de cours
sigep.fininfo.actif=true
sigep.fininfo.repertoire=${user.home}/sigep-dev/fininfo/entree
sigep.fininfo.repertoire-archive=${user.home}/sigep-dev/fininfo/archive
sigep.fininfo.cron=0 30 18 * * MON-FRI
sigep.fininfo.cron-rattrapage=0 30 19 * * MON-FRI

# Actuator (1.5) : /health, /info, /metrics sans securite
management.security.enabled=false
endpoints.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

spring.http.multipart.max-request-size=20MB
