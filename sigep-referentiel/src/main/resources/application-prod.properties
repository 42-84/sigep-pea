# SIGEP - Referentiel - PRODUCTION
# Serveur : srv-sigep-ref-01.bas.intra
server.port=8081

spring.datasource.url=jdbc:oracle:thin:@//ora-sigep-prd.bas.intra:1521/SIGEPPRD
spring.datasource.username=SIGEP_APP
# TODO externaliser (SIGEP-301, 2018). En attendant : ne pas committer de changement de mot de passe ici.
spring.datasource.password=Sigep#Prd2016
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.tomcat.max-active=20
spring.datasource.tomcat.validation-query=SELECT 1 FROM DUAL
spring.datasource.tomcat.test-on-borrow=true

spring.jpa.database-platform=org.hibernate.dialect.Oracle10gDialect
# update en prod : les tables sont creees par les scripts DBA (db/scripts) mais Hibernate complete
# les colonnes ajoutees "a chaud". Passage en "validate" refuse par la MOE (trop de ecarts) - 2019.
spring.jpa.hibernate.ddl-auto=update
spring.datasource.initialize=false
spring.h2.console.enabled=false

sigep.securite.utilisateur-dev=

sigep.fininfo.repertoire=/appli/sigep/fininfo/entree
sigep.fininfo.repertoire-archive=/appli/sigep/fininfo/archive

logging.file=/var/log/sigep/sigep-referentiel.log
