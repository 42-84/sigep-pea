# SIGEP - configuration SonarQube (serveur sonar-bas, SonarQube 6.7 LTS)
# Cree le 15/03/2018 - FD
# NB : le plugin Gradle lit aussi ce fichier ; ne pas dupliquer les proprietes dans build.gradle.

sonar.projectKey=sigep
sonar.projectName=SIGEP - Gestion des PEA
sonar.projectVersion=2.4.0

sonar.sourceEncoding=UTF-8
sonar.language=java
sonar.java.source=1.8

sonar.modules=sigep-commun,sigep-referentiel,sigep-comptes,sigep-portefeuille

sigep-commun.sonar.projectBaseDir=sigep-commun
sigep-commun.sonar.sources=src/main/java
sigep-commun.sonar.java.binaries=build/classes/java/main

sigep-referentiel.sonar.projectBaseDir=sigep-referentiel
sigep-referentiel.sonar.sources=src/main/java
sigep-referentiel.sonar.tests=src/test/java
sigep-referentiel.sonar.java.binaries=build/classes/java/main

sigep-comptes.sonar.projectBaseDir=sigep-comptes
sigep-comptes.sonar.sources=src/main/java
sigep-comptes.sonar.tests=src/test/java
sigep-comptes.sonar.java.binaries=build/classes/java/main

sigep-portefeuille.sonar.projectBaseDir=sigep-portefeuille
sigep-portefeuille.sonar.sources=src/main/java
sigep-portefeuille.sonar.tests=src/test/java
sigep-portefeuille.sonar.java.binaries=build/classes/java/main

# Exclusions : DTO et entites (getters/setters), jeux de donnees, front (analyse separee prevue, jamais faite)
sonar.exclusions=**/dto/**,**/domaine/**,**/*Application.java,**/resources/**,frontend/**
sonar.coverage.exclusions=**/dto/**,**/domaine/**,**/config/**,**/batch/**
sonar.test.exclusions=**/*IT.java

# Rapport JaCoCo (tache jacocoTestReport, non branchee dans le Jenkinsfile)
sonar.jacoco.reportPaths=build/jacoco/test.exec
