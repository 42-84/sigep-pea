# SIGEP - reverse proxy Apache 2.4 + agent SiteMinder
# Machine : srv-sigep-web-01.bas.intra
# Fichier : /etc/httpd/conf.d/sigep.conf
#
# - authentifie l'utilisateur via le SSO groupe (agent web SiteMinder, module SmAgent)
# - sert le front Angular (fichiers statiques, /var/www/sigep)
# - route les API vers les trois services, en posant l'en-tete SM_USER attendu par SiteMinderFilter
#
# Securite / Exploitation N2 - 03/2016 ; front ajoute 07/2018 ; RequestHeader unset 10/2018 (audit securite)
#
# Les URL vues du navigateur sont prefixees par /sigep (ex. /sigep/api/plans/PEA000045127) ; le
# prefixe est retire par le ProxyPass, les services ne connaissent que /api/...

LoadModule sm_module modules/mod_sm24.so
SmInitFile "/opt/ca/webagent/conf/WebAgent.conf"

<VirtualHost *:443>
    ServerName sigep.bas.intra
    ServerAdmin exploit-n2@bas.intra

    SSLEngine on
    SSLCertificateFile      /etc/pki/tls/certs/sigep.bas.intra.crt
    SSLCertificateKeyFile   /etc/pki/tls/private/sigep.bas.intra.key
    SSLCertificateChainFile /etc/pki/tls/certs/ca-bas-interne.crt
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1

    ErrorLog  /var/log/httpd/sigep_error.log
    CustomLog /var/log/httpd/sigep_access.log combined
    LogLevel warn

    # ------------------------------------------------------------------ SiteMinder
    # Tout le site est protege par l'agent : un utilisateur non authentifie est redirige vers la
    # mire SSO. L'agent renseigne la variable d'environnement SM_USER (identifiant du realm :
    # numero client pour le portail, matricule Uxxxxxx pour les agents).
    <Location />
        AuthType SiteMinder
        Require valid-user
    </Location>

    # Sante des services : exemptee du SSO pour Centreon (verifie aussi la chaine proxy -> service)
    <Location /sigep/health>
        Satisfy Any
        Require ip 10.17.0.0/16
    </Location>

    # ------------------------------------------------------------------ en-tetes
    # On supprime un eventuel SM_USER envoye par le client (usurpation) avant de poser le notre.
    RequestHeader unset SM_USER
    RequestHeader unset X-SM-User
    RequestHeader set SM_USER "%{SM_USER}e" env=SM_USER
    RequestHeader set X-Forwarded-Proto "https"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    # 120 s : la synthese d'un plan peut depasser 60 s le soir (valorisation via portefeuille -> referentiel)

    # ------------------------------------------------------------------ API -> services
    # sigep-referentiel
    ProxyPass        /sigep/api/valeurs          http://srv-sigep-ref-01.bas.intra:8081/api/valeurs
    ProxyPassReverse /sigep/api/valeurs          http://srv-sigep-ref-01.bas.intra:8081/api/valeurs
    ProxyPass        /sigep/api/cours            http://srv-sigep-ref-01.bas.intra:8081/api/cours
    ProxyPassReverse /sigep/api/cours            http://srv-sigep-ref-01.bas.intra:8081/api/cours

    # sigep-comptes
    ProxyPass        /sigep/api/clients          http://srv-sigep-cpt-01.bas.intra:8082/api/clients
    ProxyPassReverse /sigep/api/clients          http://srv-sigep-cpt-01.bas.intra:8082/api/clients
    ProxyPass        /sigep/api/plans            http://srv-sigep-cpt-01.bas.intra:8082/api/plans
    ProxyPassReverse /sigep/api/plans            http://srv-sigep-cpt-01.bas.intra:8082/api/plans
    ProxyPass        /sigep/api/comptes-especes  http://srv-sigep-cpt-01.bas.intra:8082/api/comptes-especes
    ProxyPassReverse /sigep/api/comptes-especes  http://srv-sigep-cpt-01.bas.intra:8082/api/comptes-especes
    # NB : POST /api/comptes-especes/{n}/operations est un endpoint interne (portefeuille -> comptes).
    # Il est expose ici avec le reste du prefixe ; le controle de profil cote service ne le protege pas.
    # A restreindre (TODO securite 10/2018) :
    # <LocationMatch "^/sigep/api/comptes-especes/[^/]+/operations$">
    #     <LimitExcept GET>
    #         Require all denied
    #     </LimitExcept>
    # </LocationMatch>

    # sigep-portefeuille
    ProxyPass        /sigep/api/portefeuilles    http://srv-sigep-ptf-01.bas.intra:8083/api/portefeuilles
    ProxyPassReverse /sigep/api/portefeuilles    http://srv-sigep-ptf-01.bas.intra:8083/api/portefeuilles

    # sante (referentiel seulement : "si le ref est up, les autres le sont en general")
    ProxyPass        /sigep/health               http://srv-sigep-ref-01.bas.intra:8081/health

    # ------------------------------------------------------------------ front Angular (07/2018)
    # Build "ng build --prod --base-href /sigep/" copie a la main dans /var/www/sigep (pas dans deploy.sh)
    Alias /sigep /var/www/sigep
    <Directory /var/www/sigep>
        Options -Indexes
        AllowOverride None
        Require all granted
        # routage cote client Angular : toute URL inconnue renvoie index.html
        RewriteEngine On
        RewriteBase /sigep/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/sigep/api/
        RewriteRule . /sigep/index.html [L]
    </Directory>

    RedirectMatch ^/$ /sigep/

    # Les services ne sont joignables que depuis ce serveur et entre eux (regle pare-feu SIGEP-FW-01).
</VirtualHost>

<VirtualHost *:80>
    ServerName sigep.bas.intra
    Redirect permanent / https://sigep.bas.intra/
</VirtualHost>
