# SIGEP - Portefeuille
spring.application.name=sigep-portefeuille
server.port=8083

spring.datasource.url=jdbc:h2:file:~/sigep-dev/sigep;AUTO_SERVER=TRUE;MODE=Oracle;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sigep
spring.datasource.password=sigep
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.initialize=true
spring.datasource.continue-on-error=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2

sigep.securite.actif=true
sigep.securite.utilisateur-dev=U030001

# Services partenaires
sigep.referentiel.url=http://localhost:8081
sigep.comptes.url=http://localhost:8082

# Ordres et frais
sigep.ordres.quantite-max=100000
sigep.frais.taux-actions=0.50
sigep.frais.minimum=8.00
sigep.frais.maximum=60.00

# Batchs
sigep.coupons.cron=0 30 6 * * MON-FRI
sigep.valorisation.cron=0 0 20 * * MON-FRI

management.security.enabled=false
info.app.name=${spring.application.name}
info.app.version=@project.version@
