description = 'SIGEP - Portefeuille titres (positions, ordres, valorisation)'

apply plugin: 'org.springframework.boot'

dependencies {
    compile project(':sigep-commun')
}

springBoot {
    mainClass = 'fr.bas.sigep.portefeuille.PortefeuilleApplication'
    executable = true
}

jar {
    baseName = 'sigep-portefeuille'
}
