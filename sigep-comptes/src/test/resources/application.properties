# SIGEP - Comptes - configuration des tests
spring.application.name=sigep-comptes-test

spring.datasource.url=jdbc:h2:mem:sigep-test;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.datasource.initialize=true
spring.datasource.continue-on-error=true

spring.h2.console.enabled=false

sigep.securite.actif=true
sigep.securite.utilisateur-dev=U030001

# Services partenaires (non demarres pendant les tests : les appels echouent en ResourceAccessException)
sigep.portefeuille.url=http://localhost:8083
sigep.referentiel.url=http://localhost:8081

sigep.regles.pacte.actif=true
# pas de batch pendant les tests
sigep.controle-soldes.cron=0 0 0 31 2 *

management.security.enabled=false
