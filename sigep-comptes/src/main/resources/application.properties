# SIGEP - Comptes
spring.application.name=sigep-comptes
server.port=8082

spring.datasource.url=jdbc:h2:file:~/sigep-dev/sigep;AUTO_SERVER=TRUE;MODE=Oracle;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sigep
spring.datasource.password=sigep
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.initialize=true
spring.datasource.continue-on-error=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2

sigep.securite.actif=true
sigep.securite.utilisateur-dev=U030001

# Services partenaires
sigep.portefeuille.url=http://localhost:8083
sigep.referentiel.url=http://localhost:8081

# Regles
sigep.regles.pacte.actif=true
sigep.controle-soldes.cron=0 15 2 * * *

management.security.enabled=false
info.app.name=${spring.application.name}
info.app.version=@project.version@
